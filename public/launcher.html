<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fast Mailer — Smart Inbox Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#eef0ff;font-family:'Inter',sans-serif;color:#1a1a2e;padding:24px}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;background:#fff;padding:14px 22px;border-radius:14px;box-shadow:0 2px 12px rgba(102,126,234,0.1)}
.logo{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;color:#1a1a2e}
.logo span{color:#667eea}
.logout-btn{padding:8px 18px;background:#fff;border:2px solid #dde1ff;border-radius:8px;color:#555;font-weight:600;cursor:pointer;transition:all 0.2s}
.logout-btn:hover{border-color:#e53e3e;color:#e53e3e}
.status-bar{display:flex;align-items:center;gap:12px;padding:13px 20px;background:#fff;border:2px solid #dde1ff;border-radius:12px;margin-bottom:22px;transition:all 0.3s}
.status-bar.success{border-color:#9ae6b4;background:#f0fff4}
.status-bar.error{border-color:#ffcccc;background:#fff5f5}
.status-bar.sending{border-color:#c3d1ff;background:#f5f6ff}
.status-icon{font-size:20px}
.status-text{font-size:14px;font-weight:600;color:#333}

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  background: #fff;
  border: 2px solid #dde1ff;
  border-radius: 16px;
  padding: 24px;
  box-shadow: 0 2px 10px rgba(102,126,234,0.07);
  margin-bottom: 20px;
}
.field{margin-bottom:5px}
.field label{display:block;font-size:13px;font-weight:600;color:#333;margin-bottom:7px}
.field input,.field textarea{width:100%;padding:12px 15px;background:#f5f6ff;border:2px solid #dde1ff;border-radius:10px;color:#1a1a2e;font-family:'Inter',sans-serif;font-size:14px;outline:none;transition:all 0.2s;resize:none}
.field input:focus,.field textarea:focus{border-color:#667eea;background:#fff;box-shadow:0 0 0 4px rgba(102,126,234,0.12)}
textarea#recipients{min-height:230px;font-size:13.5px}
.pass-wrap{position:relative}
.pass-wrap input{padding-right:46px}
.toggle-pass{position:absolute;right:13px;top:50%;transform:translateY(-50%);background:none;border:none;color:#aaa;cursor:pointer;font-size:17px;padding:4px}
.rec-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.badge{font-size:11px;font-weight:700;padding:3px 12px;background:#667eea;color:#fff;border-radius:20px}

/* Live PNG & Resizer Container */
.editor-container {
  display: flex;
  flex-direction: column;
  border: 2px solid #dde1ff;
  border-radius: 10px;
  background: #f5f6ff;
  overflow: hidden;
  transition: all 0.2s;
}
.editor-container:focus-within {
  border-color: #667eea;
  background: #fff;
  box-shadow: 0 0 0 4px rgba(102,126,234,0.12);
}
.img-tools-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 12px;
  background: #eaedff;
  border-bottom: 1.5px solid #dde1ff;
  font-size: 12px;
  font-weight: 600;
  color: #475569;
}
.resize-btn {
  background: #fff;
  border: 1px solid #cbd5e1;
  border-radius: 5px;
  padding: 3px 8px;
  font-size: 11px;
  font-weight: 700;
  color: #334155;
  cursor: pointer;
  transition: all 0.15s;
}
.resize-btn:hover {
  background: #667eea;
  color: #fff;
  border-color: #667eea;
}
.editor-wrap {
  min-height: 190px;
  max-height: 270px;
  overflow-y: auto;
  padding: 12px 15px;
  color: #1a1a2e;
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  line-height: 1.6;
  outline: none;
}
.editor-wrap:empty:before {
  content: attr(placeholder);
  color: #94a3b8;
  cursor: text;
}
.editor-wrap img {
  max-width: 100%;
  height: auto;
  border-radius: 8px;
  margin: 8px 0;
  display: block;
  cursor: pointer;
}
.editor-wrap img.selected-img {
  outline: 3px solid #667eea;
}

/* Action Buttons Grid Span */
.action-row-wrap {
  grid-column: span 2;
  display: flex;
  gap: 12px;
  margin-top: 5px;
}
.send-btn{flex:1;padding:15px;background:linear-gradient(135deg,#667eea,#764ba2);border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:8px}
.send-btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 10px 28px rgba(102,126,234,0.4)}
.send-btn:disabled{opacity:0.6;cursor:not-allowed}
.clear-btn{padding:15px 22px;background:#fff;border:2px solid #dde1ff;border-radius:12px;color:#555;font-weight:600;cursor:pointer;transition:all 0.2s}
.clear-btn:hover{border-color:#e53e3e;color:#e53e3e}

.progress-wrap{display:none;align-items:center;gap:14px;padding:14px 20px;background:#fff;border:2px solid #dde1ff;border-radius:12px;margin-bottom:20px}
.progress-bar{flex:1;height:8px;background:#eef0ff;border-radius:10px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#667eea,#764ba2);border-radius:10px;width:0%;transition:width 0.3s ease}
.progress-text{font-size:13px;font-weight:600;color:#667eea;white-space:nowrap}

.log-box{display:none;background:#fff;border:2px solid #dde1ff;border-radius:14px;overflow:hidden}
.log-header{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:2px solid #eef0ff;background:#f5f6ff}
.log-title{font-size:12px;font-weight:700;color:#667eea;text-transform:uppercase;letter-spacing:1px}
.log-clear{background:none;border:none;color:#aaa;font-size:13px;cursor:pointer;font-weight:600}
.log-clear:hover{color:#e53e3e}
.log-list{padding:12px;max-height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.log-item{display:flex;align-items:flex-start;gap:10px;padding:9px 13px;border-radius:8px;font-size:13px;font-weight:500}
.log-item.ok{background:#f0fff4;color:#276749}
.log-item.fail{background:#fff5f5;color:#e53e3e}

@media(max-width:700px){
  .form-grid{grid-template-columns:1fr}
  .action-row-wrap{grid-column:span 1}
  body{padding:14px}
}
</style>
</head>
<body>

<div class="header">
  <div class="logo">📧 Fast<span>Mailer</span></div>
  <button class="logout-btn" id="logoutBtn" ondblclick="handleLogout()" title="Double click to logout">⎋ Double Click to Logout</button>
</div>

<div class="status-bar" id="statusBar">
  <span class="status-icon" id="statusIcon">⚡</span>
  <span class="status-text" id="statusText">Ready to launch</span>
</div>

<div class="form-grid">
  <!-- Row 1 -->
  <div class="field">
    <label>Sender Name</label>
    <input id="senderName" type="text" placeholder="e.g. Cameron">
  </div>
  <div class="field">
    <label>Your Gmail</label>
    <input id="gmailId" type="email" placeholder="you@gmail.com">
  </div>

  <!-- Row 2 -->
  <div class="field">
    <label>App Password</label>
    <div class="pass-wrap">
      <input id="appPassword" type="password" placeholder="Google App Password">
      <button class="toggle-pass" onclick="togglePass()">👁</button>
    </div>
  </div>
  <div class="field">
    <label>Subject</label>
    <input id="subject" type="text" placeholder="e.g. Quick question">
  </div>

  <!-- Row 3: Live Resizable PNG & Image Supported Message Box -->
  <div class="field">
    <label>Message Body (Paste PNG & Resize with Controls)</label>
    <div class="editor-container">
      <div class="img-tools-bar">
        <span>🖼️ Resize Image:</span>
        <button type="button" class="resize-btn" onclick="resizeSelectedImg('40%')">Small (40%)</button>
        <button type="button" class="resize-btn" onclick="resizeSelectedImg('70%')">Medium (70%)</button>
        <button type="button" class="resize-btn" onclick="resizeSelectedImg('100%')">Full (100%)</button>
        <button type="button" class="resize-btn" onclick="promptCustomSize()">Custom px</button>
      </div>
      <div id="messageBody" class="editor-wrap" contenteditable="true" placeholder="Type message or paste PNG image (Ctrl+V)... Click on pasted image to resize."></div>
    </div>
  </div>

  <div class="field">
    <div class="rec-header">
      <label>Recipients (comma or newline)</label>
      <span class="badge" id="recipientCount">0 recipients</span>
    </div>
    <textarea id="recipients" placeholder="Paste emails here:&#10;&#10;john@example.com&#10;jane@example.com" oninput="countRecipients()"></textarea>
  </div>

  <!-- Row 4: Send All & Clear All Buttons -->
  <div class="action-row-wrap">
    <button class="send-btn" id="sendBtn" onclick="sendAll()">🚀 Send All Emails (1-by-1 Pure Stream)</button>
    <button class="clear-btn" onclick="clearAll()">🗑 Clear All</button>
  </div>
</div>

<div class="progress-wrap" id="progressWrap">
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <span class="progress-text" id="progressText">0 / 0</span>
</div>

<div class="log-box" id="logBox">
  <div class="log-header">
    <span class="log-title">📋 Send Log</span>
    <button class="log-clear" onclick="clearLog()">✕ Clear</button>
  </div>
  <div class="log-list" id="logList"></div>
</div>

<script>
function parseEmails(raw){return raw.split(/[\n,]+/).map(e=>e.trim().toLowerCase()).filter(e=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e))}
function countRecipients(){const e=parseEmails(document.getElementById('recipients').value),b=document.getElementById('recipientCount');b.textContent=`${e.length} recipients`}
function togglePass(){const i=document.getElementById('appPassword');i.type=i.type==='password'?'text':'password'}
function setStatus(t,icon,text){const b=document.getElementById('statusBar');b.className='status-bar '+t;document.getElementById('statusIcon').textContent=icon;document.getElementById('statusText').textContent=text}
function addLog(t,icon,msg){const lb=document.getElementById('logBox'),ll=document.getElementById('logList');lb.style.display='block';const i=document.createElement('div');i.className=`log-item ${t}`;i.innerHTML=`<span>${icon}</span><span>${msg}</span>`;ll.appendChild(i);lb.scrollTop=lb.scrollHeight}
function clearLog(){document.getElementById('logList').innerHTML='';document.getElementById('logBox').style.display='none'}
function setProgress(cur,tot){const w=document.getElementById('progressWrap');w.style.display='flex';const pct=tot>0?Math.round(cur/tot*100):0;document.getElementById('progressFill').style.width=pct+'%';document.getElementById('progressText').textContent=`Sending ${cur} / ${tot}`}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}

let currentSelectedImg = null;

// Image Selection Highlighter
document.getElementById('messageBody').addEventListener('click', function(e) {
  if (e.target.tagName === 'IMG') {
    document.querySelectorAll('#messageBody img').forEach(img => img.classList.remove('selected-img'));
    currentSelectedImg = e.target;
    currentSelectedImg.classList.add('selected-img');
  } else {
    if (currentSelectedImg) {
      currentSelectedImg.classList.remove('selected-img');
      currentSelectedImg = null;
    }
  }
});

// Resize Actions
function resizeSelectedImg(widthVal) {
  const target = currentSelectedImg || document.querySelector('#messageBody img:last-of-type');
  if (target) {
    target.style.width = widthVal;
    target.style.height = 'auto';
  } else {
    alert('Pasted image par click karein phir size change karein.');
  }
}

function promptCustomSize() {
  const target = currentSelectedImg || document.querySelector('#messageBody img:last-of-type');
  if (!target) {
    alert('Pasted image par click karein.');
    return;
  }
  const px = prompt('Width in pixels daalein (e.g. 150):', '150');
  if (px && !isNaN(px)) {
    target.style.width = px + 'px';
    target.style.height = 'auto';
  }
}

// Clipboard PNG Paste Handler
document.getElementById('messageBody').addEventListener('paste', function (e) {
  const items = (e.clipboardData || e.originalEvent.clipboardData).items;
  for (let index in items) {
    const item = items[index];
    if (item.kind === 'file' && item.type.startsWith('image/')) {
      e.preventDefault();
      const blob = item.getAsFile();
      const reader = new FileReader();
      reader.onload = function (event) {
        const img = document.createElement('img');
        img.src = event.target.result;
        img.style.width = '70%';
        img.style.height = 'auto';
        img.style.borderRadius = '8px';
        img.style.margin = '8px 0';
        
        const sel = window.getSelection();
        if (sel.getRangeAt && sel.rangeCount) {
          const range = sel.getRangeAt(0);
          range.deleteContents();
          range.insertNode(img);
          range.collapse(false);
        } else {
          document.getElementById('messageBody').appendChild(img);
        }
      };
      reader.readAsDataURL(blob);
    }
  }
});

// Spintax Support
function parseSpintax(text) {
  const matches = text.match(/\{[^{}]+\}/g);
  if (!matches) return text;
  for (let match of matches) {
    const choices = match.slice(1, -1).split('|');
    const randomChoice = choices[Math.floor(Math.random() * choices.length)];
    text = text.replace(match, randomChoice);
  }
  return parseSpintax(text);
}

function getDynamicTemplate(rawHtml, index) {
  if (!rawHtml || rawHtml.trim().length === 0) return '';
  let templatePool = [rawHtml.trim()];
  if (rawHtml.includes('---OR---')) {
    templatePool = rawHtml.split('---OR---').map(t => t.trim()).filter(t => t.length > 0);
  }
  let selected = templatePool[index % templatePool.length];
  return parseSpintax(selected);
}

function validate(){
  const fields=[
    {id:'senderName',label:'Sender Name'},
    {id:'gmailId',label:'Your Gmail'},
    {id:'appPassword',label:'App Password'},
    {id:'subject',label:'Subject'}
  ];
  for(const f of fields){
    if(!document.getElementById(f.id).value.trim()){
      setStatus('error','❌',`${f.label} is required`);
      document.getElementById(f.id).focus();
      return false;
    }
  }

  const editor = document.getElementById('messageBody');
  const messageContent = editor.innerHTML.trim();
  if(!messageContent || messageContent === '<br>'){
    setStatus('error','❌','Message Body is required');
    editor.focus();
    return false;
  }

  const emails=parseEmails(document.getElementById('recipients').value);
  if(emails.length===0){
    setStatus('error','❌','Add at least 1 valid recipient');
    return false;
  }
  return emails;
}

async function sendAll(){
  const emails=validate();if(!emails)return;

  // Clear outline selection before sending
  document.querySelectorAll('#messageBody img').forEach(img => img.classList.remove('selected-img'));

  const senderName=document.getElementById('senderName').value.trim();
  const gmailId=document.getElementById('gmailId').value.trim();
  const appPassword=document.getElementById('appPassword').value.trim();
  const baseSubject=document.getElementById('subject').value.trim();
  const rawHtmlBody=document.getElementById('messageBody').innerHTML;
  const btn=document.getElementById('sendBtn');
  
  btn.disabled=true; btn.innerHTML='⏳ Sending 1-by-1 Stream...';
  clearLog(); 
  setStatus('sending','📤',`Sending... (0/${emails.length})`); 
  setProgress(0, emails.length);
  
  let ok=0, fail=0;

  // 1-by-1 Sequential Stream (~60ms pacing)
  for(let i=0; i<emails.length; i++){
    const email = emails[i];
    const finalHtml = getDynamicTemplate(rawHtmlBody, i);

    try{
      const res=await fetch('/api/send-email',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          senderName,
          gmailId,
          appPassword,
          subject: baseSubject,
          htmlBody: finalHtml,
          to: email
        })
      });
      const d=await res.json();
      if(res.ok && d.success){
        ok++; 
        addLog('ok','✅',`[${i+1}/${emails.length}] Delivered to Inbox → ${email}`);
      } else {
        fail++; 
        addLog('fail','❌',`[${i+1}/${emails.length}] Failed → ${email}`);
      }
    }catch{
      fail++; 
      addLog('fail','❌',`[${i+1}/${emails.length}] Error → ${email}`);
    }

    setProgress(i + 1, emails.length);
    setStatus('sending','📤',`Sending... (${i+1}/${emails.length})`);

    if(i + 1 < emails.length) {
      await sleep(60);
    }
  }

  if(fail===0){
    setStatus('success','🎉',`All emails delivered successfully! (${ok}/${emails.length})`);
  } else if(ok===0){
    setStatus('error','💥',`All emails failed! (0/${emails.length}) — Check credentials.`);
  } else {
    setStatus('sending','⚠️',`${ok}/${emails.length} delivered, ${fail} failed`);
  }

  btn.disabled=false; 
  btn.innerHTML='🚀 Send All Emails (1-by-1 Pure Stream)';
}

function clearAll(){
  ['senderName','gmailId','appPassword','subject','recipients'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('messageBody').innerHTML = '';
  countRecipients();
  clearLog();
  document.getElementById('progressWrap').style.display='none';
  setStatus('','⚡','Ready to launch');
}

async function handleLogout(){
  await fetch('/logout',{method:'POST'});
  window.location.href='/';
}
</script>
</body>
</html>
