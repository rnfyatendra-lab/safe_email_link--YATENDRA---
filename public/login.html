<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inbox Master — Authenticated Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:radial-gradient(circle at top left,#3b82f6,#1e1b4b 60%,#0f172a);display:flex;align-items:center;justify-content:center;font-family:'Plus Jakarta Sans',sans-serif;padding:24px;color:#0f172a}
.login-card{background:rgba(255,255,255,0.98);border-radius:24px;padding:48px 42px;width:100%;max-width:440px;box-shadow:0 25px 60px -15px rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.5)}
.brand{text-align:center;margin-bottom:32px}
.brand-icon{font-size:42px;display:inline-block;margin-bottom:12px;background:#eff6ff;padding:12px;border-radius:18px;border:1px solid #bfdbfe}
.brand-title{font-size:26px;font-weight:800;letter-spacing:-0.5px;color:#0f172a}
.brand-title span{color:#2563eb}
.brand-subtitle{color:#64748b;font-size:14px;margin-top:6px;font-weight:500}
.field-group{margin-bottom:20px}
.field-group label{display:block;font-size:13px;font-weight:700;color:#334155;margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px}
.field-group input{width:100%;padding:14px 18px;background:#f8fafc;border:2px solid #e2e8f0;border-radius:12px;color:#0f172a;font-family:'Plus Jakarta Sans',sans-serif;font-size:15px;font-weight:500;outline:none;transition:all 0.2s}
.field-group input:focus{border-color:#2563eb;background:#ffffff;box-shadow:0 0 0 4px rgba(37,99,235,0.15)}
.field-group input::placeholder{color:#94a3b8}
.submit-btn{width:100%;padding:16px;margin-top:6px;background:linear-gradient(135deg,#2563eb,#4f46e5);border:none;border-radius:12px;color:#ffffff;font-family:'Plus Jakarta Sans',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:all 0.2s;box-shadow:0 10px 20px -5px rgba(37,99,235,0.4)}
.submit-btn:hover{transform:translateY(-1px);box-shadow:0 15px 30px -5px rgba(37,99,235,0.5)}
.submit-btn:disabled{opacity:0.6;cursor:not-allowed;transform:none}
.alert-box{margin-top:16px;padding:12px 16px;border-radius:10px;font-size:13px;text-align:center;display:none;font-weight:600}
.alert-box.error{background:#fef2f2;border:1.5px solid #fecaca;color:#dc2626;display:block}
.alert-box.success{background:#f0fdf4;border:1.5px solid #bbf7d0;color:#16a34a;display:block}
</style>
</head>
<body>
<div class="login-card">
  <div class="brand">
    <div class="brand-icon">⚡</div>
    <div class="brand-title">Inbox<span>Master</span></div>
    <div class="brand-subtitle">6-Parallel Direct Inbox Dispatcher</div>
  </div>
  <div class="field-group">
    <label>Username</label>
    <input id="username" type="text" placeholder="Enter username (Default: admin)">
  </div>
  <div class="field-group">
    <label>Password</label>
    <input id="password" type="password" placeholder="Enter password (Default: admin123)">
  </div>
  <button class="submit-btn" id="loginBtn">Authorize & Enter Dashboard →</button>
  <div class="alert-box" id="status"></div>
</div>
<script>
const btn=document.getElementById('loginBtn'),st=document.getElementById('status');
async function doLogin(){
  const u=document.getElementById('username').value.trim(),p=document.getElementById('password').value.trim();
  if(!u||!p){st.className='alert-box error';st.textContent='Please provide both username & password';return}
  btn.disabled=true;btn.textContent='Authenticating...';st.className='alert-box';
  try{
    const r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
    const d=await r.json();
    if(d.success){st.className='alert-box success';st.textContent='✅ Authorized! Loading dispatcher...';setTimeout(()=>window.location.href='/launcher',600)}
    else{st.className='alert-box error';st.textContent='❌ '+(d.message||'Authentication failed');btn.disabled=false;btn.textContent='Authorize & Enter Dashboard →'}
  }catch(e){st.className='alert-box error';st.textContent='❌ Network Connection Error';btn.disabled=false;btn.textContent='Authorize & Enter Dashboard →'}
}
btn.addEventListener('click',doLogin);
document.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
</script>
</body>
</html>
