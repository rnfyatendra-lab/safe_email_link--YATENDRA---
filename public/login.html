<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fast Mailer — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:linear-gradient(135deg,#dc2626 0%,#991b1b 100%);display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;padding:20px}
.card{background:#ffffff;border-radius:24px;padding:48px 42px;width:100%;max-width:420px;box-shadow:0 25px 50px -12px rgba(0,0,0,0.25)}
.logo{text-align:center;margin-bottom:34px}
.logo-icon{font-size:52px;display:block;margin-bottom:12px}
.logo-title{font-size:28px;font-weight:700;color:#0f172a}
.logo-title span{color:#dc2626}
.subtitle{color:#64748b;font-size:14px;margin-top:6px}
.field{margin-bottom:20px}
.field label{display:block;font-size:13px;font-weight:600;color:#334155;margin-bottom:8px}
.field input{width:100%;padding:14px 18px;background:#f8fafc;border:1.5px solid #cbd5e1;border-radius:12px;color:#0f172a;font-size:15px;outline:none;transition:all 0.2s}
.field input:focus{border-color:#dc2626;background:#fff;box-shadow:0 0 0 4px rgba(220,38,38,0.15)}
.field input::placeholder{color:#94a3b8}
.btn{width:100%;padding:15px;margin-top:6px;background:linear-gradient(135deg,#ef4444,#dc2626);border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:all 0.2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 25px rgba(220,38,38,0.4)}
.btn:disabled{opacity:0.6;cursor:not-allowed;transform:none}
.status{margin-top:16px;padding:12px 16px;border-radius:10px;font-size:13px;text-align:center;display:none;font-weight:500}
.status.error{background:#fef2f2;border:1.5px solid #fca5a5;color:#991b1b;display:block}
.status.success{background:#f0fdf4;border:1.5px solid #86efac;color:#166534;display:block}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <span class="logo-icon">📧</span>
    <div class="logo-title">Fast<span>Mailer</span></div>
    <div class="subtitle">Sign in to launch your campaigns</div>
  </div>
  <div class="field"><label>Username</label><input id="username" type="text" placeholder="Enter your username"></div>
  <div class="field"><label>Password</label><input id="password" type="password" placeholder="Enter your password"></div>
  <button class="btn" id="loginBtn">Sign In →</button>
  <div class="status" id="status"></div>
</div>
<script>
const btn=document.getElementById('loginBtn'),st=document.getElementById('status');
async function doLogin(){
  const u=document.getElementById('username').value.trim(),p=document.getElementById('password').value.trim();
  if(!u||!p){st.className='status error';st.textContent='Username and password required';return}
  btn.disabled=true;btn.textContent='Signing in...';st.className='status';
  try{
    const r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
    const d=await r.json();
    if(d.success){
      st.className='status success';
      st.textContent='✅ Login successful!';
      setTimeout(()=>window.location.replace('/launcher'),500);
    } else {
      st.className='status error';
      st.textContent='❌ '+(d.message||'Invalid credentials');
      btn.disabled=false;
      btn.textContent='Sign In →';
    }
  }catch(e){
    st.className='status error';
    st.textContent='❌ Connection error';
    btn.disabled=false;
    btn.textContent='Sign In →';
  }
}
btn.addEventListener('click',doLogin);
document.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
</script>
</body>
</html>
